[package]
name = "edgar"
version = "0.1.0"
edition = "2024"

# SEC EDGAR as a source: the filings, cached on disk under cache/, and the
# client that fetches them. Readers of the cache (equities) depend on this
# crate without the `fetch` feature, so they never touch the network.

[features]
default = ["fetch"]
fetch = ["dep:reqwest"]

[dependencies]
chrono = "0.4.44"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.150"
reqwest = { version = "0.13.4", features = ["blocking", "gzip"], optional = true }
# Bulk submissions (fetch) and the fund data sets (read).
zip = { version = "7.2.0", default-features = false, features = ["deflate"] }
# Reading statements into the accounting's items: the vocabulary and the
# Statements interface are equities'; the format is ours.
equities = { path = "../equities" }
calamine = "0.35.0"
regex = "1.12.4"
scraper = "0.26.0"

[[bin]]
name = "fetch"
required-features = ["fetch"]

[[bin]]
name = "edgar-funds"
path = "src/bin/funds.rs"
required-features = ["fetch"]

[[bin]]
name = "universe"
required-features = ["fetch"]

[[bin]]
name = "edgar-progress"
path = "src/bin/progress.rs"
