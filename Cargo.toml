[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "lib"

[dependencies]
bible = { path = "bible" }
csv = "1.3.1"
daemon = { path = "daemon" }
edgar = { path = "edgar", default-features = false }
edinet = { path = "edinet", default-features = false }
fred = { path = "fred", default-features = false }
mops = { path = "mops", default-features = false }
tiingo = { path = "equities/tiingo", default-features = false }
equities = { path = "equities" }
greece = { path = "greece" }
influx = { path = "influx" }
name = { path = "name" }
serde = { version = "1.0", features = ["derive"] }
store = { path = "equities/store" }
serde_json = "1.0.149"
uniffi = { version = "0.31", features = ["cli"] }
calamine = "0.34.0"
chrono = "0.4.44"
reqwest = { version = "0.13.3", features = ["blocking"] }

[workspace]
resolver = "3" # TODO(atec): why 3
members = ["bible", "daemon", "edgar", "edinet", "equities", "equities/backtest", "equities/store", "equities/tiingo", "fred", "greece", "gutenberg", "influx", "mops", "name", "scrape", "shakespeare"]

# Optimize dependencies in dev/test builds (calamine, scraper, regex parse
# whole filings in tests and examples). Workspace crates stay
# at opt-level 0, so incremental builds remain fast.
[profile.dev.package."*"]
opt-level = 3
