[package]
name = "lib"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "lib"]
name = "lib"

[dependencies]
bible = { path = "bible" }
daemon = { path = "daemon" }
greece = { path = "greece" }
name = { path = "name" }
uniffi = { version = "0.31", features = ["cli"] }

[workspace]
resolver = "3" # TODO(atec): why 3
members = ["bible", "daemon", "edgar", "edinet", "equities", "equities/api", "equities/backtest", "equities/store", "equities/tiingo", "fred", "greece", "gutenberg", "mops", "name", "plaid", "scrape", "shakespeare"]

# Optimize dependencies in dev/test builds (calamine, scraper, regex parse
# whole filings in tests and examples). Workspace crates stay
# at opt-level 0, so incremental builds remain fast.
[profile.dev.package."*"]
opt-level = 3
