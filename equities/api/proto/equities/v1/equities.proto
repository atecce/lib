  ITEM_FINANCE_RECEIVABLES_CURRENT = 10;
  ITEM_FINANCE_RECEIVABLES_NON_CURRENT = 11;
  ITEM_SOLAR_ENERGY_SYSTEMS_NET = 12;
  ITEM_PROPERTY_AND_EQUIPMENT_NET = 13;
  ITEM_OPERATING_LEASE_ASSETS = 14;
