  ITEM_DEFERRED_REVENUE_NET_OF_CURRENT_PORTION = 33;
  ITEM_LONG_TERM_OPERATING_LEASE_LIABILITIES = 34;
  ITEM_OTHER_LONG_TERM_LIABILITIES = 35;
  ITEM_OTHER_NON_CURRENT_LIABILITIES = 36;
  ITEM_TOTAL_NON_CURRENT_LIABILITIES = 37;
  ITEM_TOTAL_LIABILITIES = 38;
  ITEM_TOTAL_DEBT = 39;
  ITEM_AUTOMOTIVE_DEBT = 40;
  ITEM_FINANCIAL_SERVICES_DEBT = 41;
