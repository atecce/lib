message HoldingsRequest {
  // Sync with the brokerage first, unless that was in the last 15 minutes.
  bool refresh = 1;
}

message HoldingsResponse {
  repeated Account accounts = 1;
  // When the brokerage was last synced: seconds since 1970.
  int64 synced_unix = 2;
}

message Account {
  string institution = 1;
  string name = 2;
  // As the institution says: "ira", "brokerage", "crypto exchange".
  string subtype = 3;
  // What the account is worth, as the institution reports it.
  double balance = 4;
  repeated Position positions = 5;
}

message Position {
  string ticker = 1;
  string name = 2;
  PositionKind kind = 3;
  // Negative for a short.
  double quantity = 4;
  // Per share; per contract (x100) for an option.
  double price = 5;
  // quantity x price: negative for a short or a margin debit.
  double value = 6;
  // What the position cost, so value - cost is its unrealized gain; for a
  // short, minus what the short sales brought in. Unset when not known, and
  // for options and cash.
  optional double cost = 7;
  CostSource cost_source = 8;
  // The day of the price: days since 1970-01-01.
  int32 price_epoch_day = 9;
}

enum PositionKind {
  POSITION_KIND_UNSPECIFIED = 0;
  // Shares, funds, crypto held.
  POSITION_KIND_LONG = 1;
  // Shares sold short.
  POSITION_KIND_SHORT = 2;
  // An option contract, long or short: its value only, for now.
  POSITION_KIND_OPTION = 3;
  // Cash; negative for a margin debit.
  POSITION_KIND_CASH = 4;
}

enum CostSource {
  COST_SOURCE_UNSPECIFIED = 0;
  // The institution's cost basis.
  COST_SOURCE_INSTITUTION = 1;
  // The proceeds of the short sales still open (the newest ones: earlier
  // ones were covered first).
  COST_SOURCE_SHORT_SALES = 2;
}

message MacroRequest {
  // FRED IDs: "GS10", "PCEPILFE". At most 64; unknown ones are left out of
  // the response.
  repeated string series = 1;
}

message MacroResponse {
  repeated MacroSeries series = 1;
}

message MacroSeries {
  string id = 1;
  // The list's note: "10-year, monthly, 1953–".
  string title = 2;
  // In date order, in the series' own units (percent, index, $m, ...).
  repeated Point points = 3;
}
