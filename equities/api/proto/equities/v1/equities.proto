// The equities API: what the Optimates app reads, served by equities-api
// (lib, equities/api) at api.atec.pub behind Cloudflare Access, over the
// Connect protocol (connectrpc.com): each call a POST of one message to
// /equities.v1.Equities/<Method>, as protobuf (application/proto) or JSON
// (application/json).
//
// The contract between the server (Rust, prost) and the app (Swift,
// swift-protobuf and connect-swift): both compile from this file. Changes
// must not break the app already on the phone: add fields and values, never
// renumber or reuse one; a removed one's number is reserved.
syntax = "proto3";

package equities.v1;

service Equities {
  // The listings whose company filed in the last 400 days.
  rpc Tickers(TickersRequest) returns (TickersResponse);
  // A company's reported items and market series, in every currency it
  // reports in.
  rpc Dashboard(DashboardRequest) returns (DashboardResponse);
  // The owner's brokerage accounts (Plaid): holdings and unrealized gains.
  // Only for the owner (PORTFOLIO_OWNERS) and the Mac's service token:
  // others get permission_denied.
  rpc Holdings(HoldingsRequest) returns (HoldingsResponse);
  // FRED series by ID (fred/rates.txt, macro.txt, realestate.txt), from
  // Postgres: interest rates, inflation, output, money, real estate.
  rpc Macro(MacroRequest) returns (MacroResponse);
}

message TickersRequest {}

message TickersResponse {
  // Upper case, as listed: "AAPL", "7203.T".
  repeated string tickers = 1;
}

message DashboardRequest {
  // A ticker of Tickers; case doesn't matter.
  string ticker = 1;
  // Each item in each period (as last reported, restatements included).
  repeated Item items = 2;
  repeated Period periods = 3;
  // Market series, each in the currency of the market.
  repeated MarketField market = 4;
}

message DashboardResponse {
  // One per item and period, or market field, and currency that has data;
  // none for those that have none.
  repeated Series series = 1;
}

message Series {
  oneof of {
    Reported reported = 1;
    MarketField market = 2;
  }
  // ISO 4217: "USD", "JPY".
  string currency = 3;
  // In date order.
  repeated Point points = 4;
}

// A reported item for a period.
message Reported {
  Item item = 1;
  Period period = 2;
}

message Point {
  // Days since 1970-01-01: a period's end, or a market day.
  int32 epoch_day = 1;
  double value = 2;
}

// What a reported value covers.
enum Period {
  PERIOD_UNSPECIFIED = 0;
  // A flow over three months (3m).
  PERIOD_QUARTER = 1;
  // Six months (6m).
  PERIOD_HALF_YEAR = 2;
  // Nine months (9m).
  PERIOD_NINE_MONTHS = 3;
  // Twelve months (12m).
  PERIOD_YEAR = 4;
  // A stock, at the period's end (pit).
  PERIOD_POINT_IN_TIME = 5;
}

// A series from prices: the close, and the company's value at it.
enum MarketField {
  MARKET_FIELD_UNSPECIFIED = 0;
  MARKET_FIELD_CLOSE = 1;
  MARKET_FIELD_MARKET_CAP = 2;
  MARKET_FIELD_PRICE_TO_BOOK = 3;
  // Over the last four quarters.
  MARKET_FIELD_RETURN_ON_EQUITY = 4;
  // Over the last four quarters.
  MARKET_FIELD_EARNINGS_YIELD = 5;
}

// A line of a financial statement: equities::Item (equities/src/item.rs),
