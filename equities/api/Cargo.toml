[package]
name = "equities-api"
version = "0.1.0"
edition = "2024"

# What the Optimates app reads (tickers, a company's dashboard), from
# Postgres, for whoever Cloudflare Access let through: it checks Access's
# signed assertion on every request and holds the database credentials
# itself, so the app's only credential is its Access sign-in. See README.md.

[dependencies]
axum = "0.8"
chrono = { version = "0.4.44", features = ["serde"] }
jsonwebtoken = "9"
reqwest = { version = "0.13.3", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0.149"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "sync", "time", "signal"] }
tokio-postgres = { version = "0.7", features = ["with-chrono-0_4"] }

[[bin]]
name = "equities-api"
path = "src/main.rs"
